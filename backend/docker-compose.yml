services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: instarix
      POSTGRES_PASSWORD: instarix
      POSTGRES_DB: instarix
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instarix -d instarix"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://instarix:instarix@db:5432/instarix
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no ambiente}
      SECRETS_KEYS: ${SECRETS_KEYS:?defina SECRETS_KEYS no ambiente}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      MEDIA_STORAGE_DIR: /app/media
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    environment:
      <<: *app_env
      JOB_WORKER_THREADS: ${JOB_WORKER_THREADS:-2}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.workers.worker

volumes:
  pgdata:
  media:
